services:
  flightpanel:
    build: ./server
    container_name: flightpanel
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"     # unprivileged; on Linux the owner of ./data (PUID, PGID in .env)
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data        # bundled data (airlines.json ...), logos, database; must be owned by PUID:PGID
    # Hardening: nothing writable except /data and a small /tmp, no capabilities, no new privileges, few processes
    read_only: true
    tmpfs:
      - /tmp:size=64m
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:                 # keep a Traefik with Docker provider from publishing this port, which has no login
      - traefik.enable=false
    logging:                # cap the Docker log (about 1 MB a day), otherwise it grows forever
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
