# Server: Container bauen wie auf dem Server, darin Lint und Tests.
name: server

on:
  push:
    paths-ignore: ["firmware/**", "docs/**", "**.md"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Container bauen
        run: docker build -t flightpanel server
      - name: Lint und Tests im Container
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo flightpanel sh -c
          "pip install -q --root-user-action=ignore -r server/requirements-dev.txt
          && ruff check . && python -m pytest -p no:cacheprovider"
