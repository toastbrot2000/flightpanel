# Nur Werkzeuge für die Entwicklung: Tests und Lint vom Repo-Wurzelverzeichnis aus.
#   pip install --require-hashes -r server/requirements-dev.lock
#   pytest
#   ruff check .

[tool.pytest.ini_options]
testpaths = ["server/tests"]
pythonpath = ["server"]
addopts = "-q"
# Veraltete Aufrufe im eigenen Code sind Fehler: tools/escrow.py übernimmt neue Pillow-
# und aiohttp-Versionen, und was dort bald wegfällt, soll vorher in den Tests auffallen.
filterwarnings = ["error::DeprecationWarning:flightpanel.*"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# S608: SQL nur mit Platzhaltern, nie zusammengebaut (db.py und die Speicher)
select = ["E", "F", "W", "B", "I", "UP", "RUF", "S608"]
ignore = [
    "UP031",    # %-Format, wo der Text selbst geschweifte Klammern hat (JSON in den Tests)
]

[tool.ruff.lint.isort]
known-first-party = ["flightpanel", "conftest"]
