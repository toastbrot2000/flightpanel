services:
  flightpanel:
    build: ./server
    container_name: flightpanel
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"     # ohne Rechte; auf Linux der Besitzer von ./data (PUID, PGID in .env)
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data        # mitgelieferte Daten (airlines.json ...), Logos, Datenbank; muss PUID:PGID gehören
    # Härtung: nichts Schreibbares außer /data und /tmp (klein), keine Rechte, keine neuen Rechte, wenige Prozesse
    read_only: true
    tmpfs:
      - /tmp:size=64m
    pids_limit: 256
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:                 # ein Traefik mit Docker-Provider soll den Port ohne Anmeldung nicht veröffentlichen
      - traefik.enable=false
    logging:                # Docker-Log begrenzen (rund 1 MB am Tag), sonst wächst es ohne Ende
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
