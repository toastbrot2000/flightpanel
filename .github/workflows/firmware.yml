# Firmware: kompiliert sie mit PlatformIO (dasselbe Skript wie lokal), wenn sie oder ihre Vertrauensliste sich ändert.
name: firmware

on:
  push:
    paths: ["firmware/**", "server/flightpanel/certs/roots.pem", "tools/check_firmware.sh", ".github/workflows/firmware.yml"]
  pull_request:
    paths: ["firmware/**", "server/flightpanel/certs/roots.pem", "tools/check_firmware.sh", ".github/workflows/firmware.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Firmware bauen
        run: sh tools/check_firmware.sh
