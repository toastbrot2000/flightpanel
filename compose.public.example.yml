# Remote panels: example, instructions in docs/remote-panels.md.
#
# Usage: copy to compose.override.yml and replace the placeholders in <angle brackets>. Compose reads that file
# automatically next to compose.yml:
#
#   cp compose.public.example.yml compose.override.yml
#   docker compose up -d
#
# What it does:
#  - creates the Docker network "flightpanel-public". Only the server and cloudflared are attached to it, nothing
#    else (no Traefik, no other services): PUBLIC_PORT is reachable only there.
#  - attaches the server to this network. There is no "ports:" entry for PUBLIC_PORT (8081), and none may be
#    added: the port would then be reachable without Cloudflare in front. Only 8080 stays published.
#  - starts cloudflared, which picks up requests from Cloudflare and forwards them to http://flightpanel:8081. Routes
#    and Access are configured in the Cloudflare dashboard (docs/remote-panels.md, steps 2 and 3).
#
# If you already run cloudflared and want to reuse it, delete the "cloudflared" block and attach the existing
# container to this network in its own compose file:
#   networks:
#     flightpanel-public:
#       external: true

services:
  flightpanel:
    networks:
      - default         # as before: data sources on the internet and the LAN port 8080
      - public          # plus the network to cloudflared
    # Label traefik.enable=false, hardening and everything else are already in compose.yml

  cloudflared:
    # PINNING IS MANDATORY: never ":latest" or a bare tag, a tag can be moved later.
    # Only use a release that has been published for at least 7 days. To get version and digest:
    #   1. pick a version at least 7 days old on https://github.com/cloudflare/cloudflared/releases
    #   2. docker buildx imagetools inspect cloudflare/cloudflared:<version>
    #      (the line "Digest: sha256:…"; without buildx: docker pull cloudflare/cloudflared:<version>, then
    #      docker image inspect --format '{{index .RepoDigests 0}}' cloudflare/cloudflared:<version>)
    #   3. enter both below. Later updates are manual again, after the 7-day wait
    image: cloudflare/cloudflared:<version>@sha256:<digest>
    command: ["tunnel", "--no-autoupdate", "run"]
    restart: unless-stopped
    # The tunnel token lives in its own file, not in .env: the server container reads .env too and doesn't need
    # the token. cloudflared.env contains only the line TUNNEL_TOKEN=… (chmod 600, listed in .gitignore)
    env_file:
      - cloudflared.env
    networks:
      - public          # this network only: the server is the only container cloudflared can reach (it still has internet access, which it needs)
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

networks:
  public:
    name: flightpanel-public   # fixed name, so an existing cloudflared can attach (external: true)
