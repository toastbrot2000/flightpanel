; flightpanel ESP32-Firmware (HUB75, 2 x 64x32 P2.5 in Reihe = 128x32)
;
;   pio run -t upload                      erstes Flashen per USB (VIN dabei abstecken!)
;   pio run -e esp32dev_ota -t upload      danach per WLAN (OTA_PASSWORD unten eintragen)
;   pio device monitor                     serielle Ausgabe

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@7.1.3         ; fest, damit ein neues Release den Build nicht ändert
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv      ; zwei App-Partitionen, nötig für OTA
lib_deps =
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#3.0.14
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit BusIO@^1.16.1
build_flags =
    -DCORE_DEBUG_LEVEL=1

[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = flightpanel.local
upload_flags =
    --auth=changeme                       ; muss zu OTA_PASSWORD in secrets.h passen
