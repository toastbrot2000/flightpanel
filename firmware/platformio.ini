; flightpanel ESP32-Firmware (HUB75, 2 x 64x32 P2.5 in Reihe = 128x32)
;
;   pio run -t upload                      erstes Flashen per USB (VIN dabei abstecken!)
;   pio run -e esp32dev_ota -t upload      danach per WLAN, mit dem OTA-Passwort aus platformio_local.ini
;   pio device monitor                     serielle Ausgabe
;
; WLAN, Server und Token kommen ins Panel über sein Einrichtungs-WLAN (docs/bauanleitung.md, Abschnitt 4).
; include/secrets.h ist freiwillig: Vorgaben für den Prüfstand und das OTA-Passwort (leer = kein OTA). Das
; OTA-Passwort steht nie in dieser Datei, sondern noch einmal in platformio_local.ini. Die liegt nicht im Repo;
; Vorlage und Anleitung: platformio_local.ini.example. Ohne sie baut die Firmware trotzdem, nur das Hochladen
; per WLAN scheitert dann an der Anmeldung. pio im Ordner firmware/ aufrufen, dort wird die Datei gesucht.

[platformio]
default_envs = esp32dev
extra_configs = platformio_local.ini      ; optional: fehlt die Datei, wird sie übersprungen

[env:esp32dev]
platform = espressif32@7.1.3         ; fest, damit ein neues Release den Build nicht ändert
board = esp32dev
framework = arduino
monitor_speed = 115200
; zwei App-Partitionen zu je 1,875 MB (statt 1,25 MB bei default.csv), nötig für OTA und genug Platz für TLS,
; Einrichtungs-WLAN und Updates. Eine neue Partitionstabelle kommt nur per USB aufs Panel, nie per OTA.
board_build.partitions = min_spiffs.csv
; Vertrauensliste für https aus ../server/flightpanel/certs/roots.pem als Header einbetten
extra_scripts = pre:embed_roots.py
lib_deps =
    ; alles fest (Commit, genaue Versionen): beim Bauen kommt nichts ungefragt neu dazu
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#f17fb7fe9d487e9643f919eb5aeedea8d9d1f8d7  ; Tag 3.0.14
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
build_flags =
    -DCORE_DEBUG_LEVEL=1
extra_scripts = post:scripts/version.py   ; FW_VERSION = Bauzeit JJMMTTHHMM (UTC), nur für src/
test_ignore = *                           ; Tests laufen auf dem Rechner: pio test -e native

[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = flightpanel.local           ; mDNS-Name des Panels, den es nur mit laufendem OTA gibt
; upload_flags (--auth=...) kommt aus platformio_local.ini, hier steht kein Passwort

[env:native]
; Tests auf dem Rechner, ohne ESP32: Manifest-Parser und Versionsvergleich (include/manifest.h, test/).
;   pio test -e native        im Ordner firmware/; braucht gcc/g++, tools/check_firmware.sh hat beides in Docker
platform = native@1.2.1
test_framework = unity
lib_deps =
    throwtheswitch/Unity@2.6.1          ; fest; ohne die Zeile holte pio die neueste 2.x
build_src_flags = -std=gnu++11 -Wall -Wextra -Werror   ; Testquellen: C++11 wie auf dem ESP32, Warnung = Fehler
