; flightpanel ESP32-Firmware (HUB75, 2 x 64x32 P2.5 in Reihe = 128x32)
;
;   pio run -t upload                      erstes Flashen per USB (VIN dabei abstecken!)
;   pio run -e esp32dev_ota -t upload      danach per WLAN, mit dem OTA-Passwort aus platformio_local.ini
;   pio device monitor                     serielle Ausgabe
;
; Das OTA-Passwort steht nie in dieser Datei: OTA_PASSWORD in include/secrets.h (leer = kein OTA)
; und dasselbe Passwort in platformio_local.ini. Die liegt nicht im Repo; Vorlage und Anleitung:
; platformio_local.ini.example. Ohne sie baut die Firmware trotzdem, nur das Hochladen per WLAN
; scheitert dann an der Anmeldung. pio im Ordner firmware/ aufrufen, dort wird die Datei gesucht.

[platformio]
default_envs = esp32dev
extra_configs = platformio_local.ini      ; optional: fehlt die Datei, wird sie übersprungen

[env:esp32dev]
platform = espressif32@7.1.3         ; fest, damit ein neues Release den Build nicht ändert
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = default.csv      ; zwei App-Partitionen, nötig für OTA
lib_deps =
    ; alles fest (Commit, genaue Versionen): beim Bauen kommt nichts ungefragt neu dazu
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git#f17fb7fe9d487e9643f919eb5aeedea8d9d1f8d7  ; Tag 3.0.14
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
build_flags =
    -DCORE_DEBUG_LEVEL=1

[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = flightpanel.local           ; mDNS-Name des Panels, den es nur mit laufendem OTA gibt
; upload_flags (--auth=...) kommt aus platformio_local.ini, hier steht kein Passwort
